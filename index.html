          try { stored = localStorage.getItem('lv_locale_choice'); } catch (e) {}
          var target = null;
          if (stored) {
            var k = stored.toLowerCase();
            if (map[k]) target = '/' + map[k];
            else if (k === 'en') return; // explicit EN choice — stay
          }
          if (!target) {
            var langs = navigator.languages || [navigator.language || 'en'];
            for (var j = 0; j < langs.length; j++) {
              var l = (langs[j] || '').toLowerCase();

          if (!target) return;
